[package]
name = "dryve"
version = "0.2.0"
edition = "2024"
description = "Pull, selectively download, and sync shared Google Drive folders from the terminal"
repository = "https://github.com/notenderdreams/dryve"
keywords = ["google-drive", "cli", "sync", "download", "tui"]

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.1.1"
crossterm = "0.29.0"
rayon = "1.12.0"
reqwest = { version = "0.13.2", features = ["blocking", "cookies"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
